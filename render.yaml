databases:
  - name: forumx-postgres
    databaseName: forumx_production
    user: forumx
    plan: free

services:
  - type: redis
    name: forumx-redis
    plan: free
    ipAllowList: []

  - type: web
    name: forumx-web
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: forumx-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: forumx-redis
          property: connectionString

  - type: worker
    name: forumx-sidekiq
    runtime: ruby
    plan: free
    buildCommand: "bundle install"
    startCommand: "bundle exec sidekiq -C config/sidekiq.yml"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: forumx-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: forumx-redis
          property: connectionString
